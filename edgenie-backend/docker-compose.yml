version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: edgenie_db
      POSTGRES_USER: edgenie_user
      POSTGRES_PASSWORD: edgenie_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgenie_user -d edgenie_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - ../ai:/app/ai
      - ./data:/app/data
      - ./classification_model:/app/classification_model
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: edgenie.settings.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery -A edgenie worker
      --loglevel=info
      --concurrency=2
      -Q default,grading,email,analytics,scraper,chat
    volumes:
      - .:/app
      - ../ai:/app/ai
      - ./data:/app/data
      - ./classification_model:/app/classification_model
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: edgenie.settings.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery -A edgenie beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
      - ../ai:/app/ai
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: edgenie.settings.development
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
