version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: edgenie.settings.production
    volumes:
      - static_volume:/app/staticfiles
      - ./data:/app/data
      - ./classification_model:/app/classification_model
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  celery:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: >
      celery -A edgenie worker
      --loglevel=warning
      --concurrency=4
      -Q default,grading,email,analytics,scraper,chat
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: edgenie.settings.production
    volumes:
      - ./data:/app/data
      - ./classification_model:/app/classification_model
    depends_on:
      - db
      - redis
    restart: always

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: >
      celery -A edgenie beat
      --loglevel=warning
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: edgenie.settings.production
    depends_on:
      - db
      - redis
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  redis_data:
  static_volume:
